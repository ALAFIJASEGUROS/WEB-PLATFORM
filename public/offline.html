<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · SeguAlaFija</title>
<style>
  :root { --bg: #f7f8fa; --surface: #fff; --ink: #10213f; --muted: #5b6b84; --brand: #0b3d91; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --surface: #131c2e; --ink: #e8edf6; --muted: #a3b0c5; --brand: #8ab4ff; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; text-align: center; background: var(--surface); border-radius: 24px; padding: 32px 24px; box-shadow: 0 4px 24px rgb(16 33 63 / .08); }
  h1 { font-size: 1.5rem; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.5; margin: 0 0 20px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0b1220; } }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6L10 13v12c0 8 7 14 14 16 7-2 14-8 14-16V13L24 6z" fill="currentColor" opacity=".9"/></svg>
  <h1>Estás sin conexión</h1>
  <p>Revisa tu internet e intenta de nuevo. Tu cotización sigue guardada en este dispositivo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
